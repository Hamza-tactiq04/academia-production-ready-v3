name: Validate Academia iOS configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-config:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      ACADEMIA_SERVER_URL: ${{ secrets.ACADEMIA_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Preflight
        run: npm run preflight
      - name: Type check
        run: npm run check
      - name: Tests
        run: npm test -- --run
      - name: Build web app
        run: npm run build
      - name: Install Capacitor dependencies
        working-directory: platforms/mobile
        run: npm install --no-audit --no-fund
      - name: Validate HTTPS backend
        working-directory: platforms/mobile
        run: npm run verify:server
      - name: Add iOS platform
        working-directory: platforms/mobile
        run: npx cap add ios
      - name: Sync iOS
        working-directory: platforms/mobile
        run: npx cap sync ios
      - name: Validate Xcode project
        working-directory: platforms/mobile/ios
        run: xcodebuild -list
